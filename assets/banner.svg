<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Yuvraj Kumar</title>
  <desc id="d">AI/ML Engineer building multi-agent LLM systems. Bengaluru, India.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#141a3c"/>
      <stop offset="1" stop-color="#2b1660"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- user space: a bounding-box gradient vanishes on perfectly vertical lines -->
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="780" y1="0" x2="1150" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .edge{fill:none;stroke:url(#edge);stroke-width:2;stroke-opacity:.8;stroke-dasharray:3 9;animation:flow 1.4s linear infinite}
    .pill{fill:#10163a;stroke:#a78bfa;stroke-opacity:.55}
    .hub{fill:#1e1650;stroke:url(#accent);stroke-width:1.5}
    .lbl{fill:#e2e8f0;font-size:14px}
    .cursor{animation:blink 1.1s steps(1) infinite}
    .glow{animation:breathe 3.2s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes blink{50%{opacity:0}}
    @keyframes breathe{50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="glow" cx="965" cy="150" r="200" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <text class="mono" x="64" y="86" font-size="17" fill="#22d3ee">$ whoami</text>
  <rect class="cursor" x="148" y="72" width="9" height="18" fill="#22d3ee"/>
  <text class="sans" x="61" y="150" font-size="62" font-weight="700" fill="#fff">Yuvraj Kumar</text>
  <text class="sans" x="64" y="192" font-size="24" fill="#c4b5fd">AI/ML Engineer · multi-agent LLM systems</text>
  <rect x="64" y="212" width="88" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="mono" x="64" y="246" font-size="17" fill="#a5b4c8">Bengaluru, India  ·  B.E. Information Science '26</text>

  <!-- an orchestrator routing work to its agents -->
  <path class="edge" d="M965 150L965 60"/>
  <path class="edge" d="M965 150L1104 104"/>
  <path class="edge" d="M965 150L1090 232"/>
  <path class="edge" d="M965 150L840 232"/>
  <path class="edge" d="M965 150L826 104"/>
  <g class="mono lbl" text-anchor="middle">
    <rect class="hub" x="901" y="131" width="128" height="38" rx="19"/>
    <text x="965" y="155" fill="#fff" font-weight="600">langgraph</text>
    <rect class="pill" x="925" y="44" width="80" height="32" rx="16"/><text x="965" y="65">ollama</text>
    <rect class="pill" x="1075" y="88" width="58" height="32" rx="16"/><text x="1104" y="109">mcp</text>
    <rect class="pill" x="1054" y="216" width="72" height="32" rx="16"/><text x="1090" y="237">evals</text>
    <rect class="pill" x="808" y="216" width="64" height="32" rx="16"/><text x="840" y="237">otel</text>
    <rect class="pill" x="797" y="88" width="58" height="32" rx="16"/><text x="826" y="109">rag</text>
  </g>
</svg>
