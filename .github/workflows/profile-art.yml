name: Profile art

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#7c3aed&color_dots=#eff2f5,#d1d9e0,#afb8c1,#818b98,#59636e
            dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#151b23,#262c36,#3d444d,#656c76,#9198a1

      # README loads these from raw.githubusercontent.com/<user>/<user>/output/<file>
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
